name: daily-update

on:
  schedule:
    - cron: "17 5 * * *"  # daily, 05:17 UTC (off the top of the hour)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch historical results and odds
        run: python -m pl_predict fetch

      - name: Simulate season (pure Elo)
        run: python -m pl_predict simulate

      - name: Simulate season (market-calibrated)
        # Polymarket outage should degrade the site, not break the build.
        continue-on-error: true
        run: python -m pl_predict simulate --market-implied

      - name: Render dashboard
        run: python scripts/plot_predictions.py

      - name: Build site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
